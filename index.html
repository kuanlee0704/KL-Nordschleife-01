<h1>🚙 RC4WD 4WD 遙控車模擬器</h1>
<p>還沒有硬體也能先開：電腦顯示 3D 小車，手機當遙控器（就是你車子要用的那個操控介面）。</p>
<a class="b" href="sim.html"><b>💻 電腦：開啟模擬器</b><span>顯示 QR 碼；沒手機時可用鍵盤 W/A/S/D</span></a>
<a class="b" href="controller.html"><b>📱 手機：開啟遙控器</b><span>輸入電腦畫面上的 6 碼，或直接掃電腦上的 QR</span></a>
<a class="b" href="nordschleife.html"><b>🏁 紐北賽車遊戲（可用手機遙控）</b><span>首頁「手機遙控」分頁就有 QR，手機掃了就能當方向盤/油門</span></a>
<a class="b" href="controller.html?demo=1"><b>🧪 單機示範介面</b><span>只看手機介面，不連線</span></a>
<ol><li>電腦先開「模擬器」</li><li>手機掃 QR（最好同一個 Wi-Fi），橫放</li><li>推油門、拖方向，電腦上的車就會動，手機同時收到超音波／轉速／鏡頭畫面</li></ol>
